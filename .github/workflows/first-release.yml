
name: First Cron Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Cron
        run: make

      - name: Verify executable
        run: |
          test -f build/cron
          chmod +x build/cron
          file build/cron

      - name: Create first release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          name: Cron v0.1
          body: |
            # Cron v0.1

            First public demo release of Cron,
            a shell written in C.

            ## Platform
            Linux x86_64

            ## Download
            Download the `cron` binary below.
          files: build/cron
          fail_on_unmatched_files: true
